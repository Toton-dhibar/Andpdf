name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Lint and build Android 8+
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-api-26

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" >/dev/null

      - name: Lint and build all Android ABIs
        working-directory: apps/pdfcraft-android/android
        run: ./gradlew lint assembleDebug assembleRelease --no-daemon

      - name: Verify packaged ABIs
        working-directory: apps/pdfcraft-android/android
        run: |
          for variant in debug release; do
            apk="app/build/outputs/apk/$variant/app-$variant.apk"
            for abi in arm64-v8a armeabi-v7a x86_64; do
              unzip -Z1 "$apk" | grep -Fxq "lib/$abi/libpdfcraft_android.so"
            done
          done

      - name: Inspect native imports linked for API 26
        working-directory: apps/pdfcraft-android/android
        run: |
          llvm_nm="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          libraries="$(find app/build -type f -name libpdfcraft_android.so)"
          test -n "$libraries"
          while IFS= read -r library; do
            echo "Dynamic imports in $library"
            "$llvm_nm" -D --undefined-only "$library"
          done <<<"$libraries"
